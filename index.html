<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Dhaka City 3D — Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="brand">DHAKA CITY <span>3D</span></div>
      <div id="area">গুলিস্তান • ঢাকা</div>
      <div id="help">WASD / Arrow: Move · Shift: Run · Space: Jump</div>
    </div>
    <div id="crosshair"></div>
    <div id="toast">ঢাকা শহরে স্বাগতম!</div>
    <div id="touch-ui">
      <div id="stick-base"><div id="stick"></div></div>
      <div class="actions">
        <button id="runBtn">RUN</button>
        <button id="jumpBtn">JUMP</button>
        <button id="camBtn">CAM</button>
      </div>
    </div>
    <div id="loading"><div class="loader"></div><b>ঢাকা শহর তৈরি হচ্ছে...</b></div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
